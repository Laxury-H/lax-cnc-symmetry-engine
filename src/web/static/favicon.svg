<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="favCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="favMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="favSpindle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#favBg)" stroke="url(#favCyan)" stroke-width="2.5"/>

  <!-- Reticle Brackets -->
  <path d="M 22 34 L 22 24 L 32 24" fill="none" stroke="#00d2ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 68 24 L 78 24 L 78 34" fill="none" stroke="#00d2ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 22 68 L 22 78 L 32 78" fill="none" stroke="#00d2ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 68 78 L 78 78 L 78 68" fill="none" stroke="#00d2ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Crosshairs -->
  <line x1="16" y1="51" x2="84" y2="51" stroke="#00d2ff" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="50" y1="36" x2="50" y2="82" stroke="#00d2ff" stroke-width="2.2" stroke-linecap="round"/>

  <!-- 4-Quadrant Symmetrical Tiles -->
  <g fill="url(#favMetal)">
    <path d="M 28 29 L 46 29 C 46 36 43 45 46 48 L 28 48 C 28 42 27 35 28 29 Z"/>
    <path d="M 72 29 L 54 29 C 54 36 57 45 54 48 L 72 48 C 72 42 73 35 72 29 Z"/>
    <path d="M 28 73 L 46 73 C 46 66 43 57 46 54 L 28 54 C 28 60 27 67 28 73 Z"/>
    <path d="M 72 73 L 54 73 C 54 66 57 57 54 54 L 72 54 C 72 60 73 67 72 73 Z"/>
  </g>

  <!-- Dark Petal Cutouts with Cyan Core -->
  <g fill="#020617" stroke="#00d2ff" stroke-width="1">
    <path d="M 31 45 C 32 37 38 33 43 33 C 42 41 36 45 31 45 Z"/>
    <path d="M 69 45 C 68 37 62 33 57 33 C 58 41 64 45 69 45 Z"/>
    <path d="M 31 57 C 32 65 38 69 43 69 C 42 61 36 57 31 57 Z"/>
    <path d="M 69 57 C 68 65 62 69 57 69 C 58 61 64 57 69 57 Z"/>
  </g>

  <!-- Spindle & Bit -->
  <rect x="37" y="9" width="26" height="4.5" rx="1.5" fill="url(#favSpindle)"/>
  <rect x="40" y="14.5" width="20" height="4.5" rx="1.5" fill="url(#favSpindle)"/>
  <path d="M 43 20 L 57 20 L 54 27 L 46 27 Z" fill="url(#favSpindle)"/>
  <rect x="48" y="27" width="4" height="17" fill="url(#favSpindle)"/>
  <line x1="48" y1="30" x2="52" y2="33" stroke="#00d2ff" stroke-width="1.4"/>
  <line x1="48" y1="35" x2="52" y2="38" stroke="#00d2ff" stroke-width="1.4"/>
  <polygon points="48 44, 52 44, 50 50.5" fill="#ffffff" stroke="#00f2fe" stroke-width="0.8"/>
  <circle cx="50" cy="51" r="2" fill="#00f2fe"/>
</svg>
